<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- maximum-scale=1 + user-scalable=no stop iOS WebView from auto-zooming
         into focused inputs and leaving the user stuck zoomed-in with no way
         to pinch back out. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f0e9df" />
    <title>Commons — Real plans. Real people. Happening now.</title>
    <!-- The Mailchimp connected-site script (which auto-showed a pop-up form)
         was removed. Signups now go only through our own in-app waitlist modal
         (Landing.tsx), which posts straight to the Mailchimp embedded-form URL
         in MAILCHIMP_ACTION. -->

    <meta
      name="description"
      content="Commons is where real plans with real people are happening now. Explore what's going on around you and join in."
    />
    <link rel="canonical" href="https://www.oncommons.co/" />

    <!-- Open Graph / iMessage / Facebook / LinkedIn link previews. Scrapers
         don't run JS, so these static tags in the SPA's only index.html are the
         one thing they read. The image URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commons" />
    <meta property="og:title" content="Commons — Real plans. Real people. Happening now." />
    <meta
      property="og:description"
      content="Commons is where real plans with real people are happening now. Explore what's going on around you and join in."
    />
    <meta property="og:url" content="https://www.oncommons.co/" />
    <meta name="application-name" content="Commons" />
    <meta name="apple-mobile-web-app-title" content="Commons" />
    <!-- ?v= busts iMessage's cached card from when this URL still resolved as Railway. -->
    <meta property="og:image" content="https://www.oncommons.co/og-image.png?v=4" />
    <meta property="og:image:secure_url" content="https://www.oncommons.co/og-image.png?v=4" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Commons — Real plans. Real people. Happening now." />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commons — Real plans. Real people. Happening now." />
    <meta
      name="twitter:description"
      content="Commons is where real plans with real people are happening now. Explore what's going on around you and join in."
    />
    <meta name="twitter:image" content="https://www.oncommons.co/og-image.png?v=4" />
    <meta name="twitter:image:alt" content="Commons — Real plans. Real people. Happening now." />

    <!-- Meta Pixel Code. The iOS app is served from localhost / capacitor://,
         so this only runs on the public site. -->
    <script>
      (function () {
        var host = location.hostname;
        if (host !== "oncommons.co" && host !== "www.oncommons.co") return;
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return;
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1549893153826243');
        fbq('track', 'PageView');
        window.__commonsMetaInited = '1549893153826243';
      })();
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1549893153826243&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
