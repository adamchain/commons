<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- maximum-scale=1 + user-scalable=no stop iOS WebView from auto-zooming
         into focused inputs and leaving the user stuck zoomed-in with no way
         to pinch back out. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Commons — Real plans. Real people. Happening now.</title>
    <!-- The Mailchimp connected-site script (which auto-showed a pop-up form)
         was removed. Signups now go only through our own in-app waitlist modal
         (Landing.tsx), which posts straight to the Mailchimp embedded-form URL
         in MAILCHIMP_ACTION. -->

    <meta
      name="description"
      content="Commons is where real plans with real people are happening now. Explore what's going on around you and join in."
    />
    <link rel="canonical" href="https://www.oncommons.co/" />

    <!-- Open Graph / iMessage / Facebook / LinkedIn link previews. Scrapers
         don't run JS, so these static tags in the SPA's only index.html are the
         one thing they read. The image URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commons" />
    <meta property="og:title" content="Commons — Real plans. Real people. Happening now." />
    <meta
      property="og:description"
      content="Commons is where real plans with real people are happening now. Explore what's going on around you and join in."
    />
    <meta property="og:url" content="https://www.oncommons.co/" />
    <meta property="og:image" content="https://www.oncommons.co/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.oncommons.co/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1920" />
    <meta property="og:image:alt" content="Commons — Real plans. Real people. Happening now." />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commons — Real plans. Real people. Happening now." />
    <meta
      name="twitter:description"
      content="Commons is where real plans with real people are happening now. Explore what's going on around you and join in."
    />
    <meta name="twitter:image" content="https://www.oncommons.co/og-image.png" />
    <meta name="twitter:image:alt" content="Commons — Real plans. Real people. Happening now." />
    <script type="module" crossorigin src="/assets/index-DqYIPHGh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CidPMlWL.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
